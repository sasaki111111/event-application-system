<!-- 実行環境: ブラウザ側。app.tsのテンプレート。共通ナビ（画面遷移図の「共通ヘッダーナビ」に対応）とrouter-outlet。 -->
<!-- [Angularの基礎] @if/@elseはAngularのテンプレート構文で、条件によって表示するHTMLを切り替える
     （JavaScriptのif/elseのテンプレート版）。カッコの中はapp.tsのprotectedなプロパティ・メソッドを
     そのまま参照できる -->
<nav>
  <span class="brand">イベント申込システム</span>
  <!-- ログイン中（currentUserIdがnullでない）の場合だけナビとログアウトボタンを表示する -->
  @if (loginUserStore.currentUserId()) {
    @if (loginUserStore.isAdmin()) {
      <!-- 画面設計書§2 共通仕様: 管理者＝［ダッシュボード／イベント管理／申込状況・実績／利用者管理／コメント管理／ログアウト］ -->
      <a routerLink="/admin/dashboard">ダッシュボード</a>
      <a routerLink="/admin/events">イベント管理</a>
      <a routerLink="/admin/reports">申込状況・実績</a>
      <a routerLink="/admin/users">利用者管理</a>
      <a routerLink="/admin/comments">コメント管理</a>
    } @else {
      <!-- 一般＝［イベント一覧／イベント検索／マイページ／ログアウト］ -->
      <a routerLink="/events">イベント一覧</a>
      <a routerLink="/events/search">イベント検索</a>
      <a routerLink="/my/applications">マイページ</a>
    }
    <!-- パスワード変更（SC-011）は一般利用者・管理者の両方に表示する -->
    <a routerLink="/my/password">パスワード変更</a>
    <button type="button" (click)="logout()">ログアウト</button>
  }
</nav>
<!-- 各画面の表示エリア。router-outletの位置に、現在のURL（app.routes.ts）に対応するコンポーネントが
     差し込まれる -->
<main class="page">
  <router-outlet />
</main>
