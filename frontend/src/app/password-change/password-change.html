<!-- 実行環境: ブラウザ側。パスワード変更画面（SC-011）のテンプレート。 -->
<h1>パスワード変更</h1>
<p class="note">8文字以上72文字以下、英字と数字をそれぞれ1文字以上含めてください</p>

@if (errorMessage()) {
  <p class="error">{{ errorMessage() }}</p>
}
@if (successMessage()) {
  <p class="success">{{ successMessage() }}</p>
}

<form (submit)="$event.preventDefault(); submit()">
  <div class="field">
    <label for="currentPassword">現在のパスワード</label>
    <!-- type="password"により、入力した文字が伏せて表示される -->
    <input
      id="currentPassword"
      type="password"
      maxlength="72"
      autocomplete="current-password"
      [value]="currentPassword()"
      (input)="onCurrentPasswordInput($any($event.target).value)"
      [class.invalid]="fieldError('currentPassword')"
    />
    @if (fieldError('currentPassword')) {
      <p class="field-error">{{ fieldError('currentPassword') }}</p>
    }
  </div>
  <div class="field">
    <label for="newPassword">新しいパスワード</label>
    <input
      id="newPassword"
      type="password"
      maxlength="72"
      autocomplete="new-password"
      [value]="newPassword()"
      (input)="onNewPasswordInput($any($event.target).value)"
      [class.invalid]="fieldError('newPassword')"
    />
    @if (fieldError('newPassword')) {
      <p class="field-error">{{ fieldError('newPassword') }}</p>
    }
  </div>
  <div class="field">
    <label for="confirmPassword">新しいパスワード（確認用）</label>
    <input
      id="confirmPassword"
      type="password"
      maxlength="72"
      autocomplete="new-password"
      [value]="confirmPassword()"
      (input)="onConfirmPasswordInput($any($event.target).value)"
    />
  </div>
  <button type="submit" [disabled]="submitting()">{{ submitting() ? '変更中...' : '変更する' }}</button>
</form>
