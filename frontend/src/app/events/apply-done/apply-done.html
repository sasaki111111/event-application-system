<!-- 実行環境: ブラウザ側。apply-done.tsのテンプレート。 -->
<!--
  @if / @else はAngularの新しい制御構文（条件分岐）。applicationがある場合は申込結果を表示し、
  無い場合（直接アクセスやリロードでnavigation stateが失われた場合）は案内文を表示する。
-->
@if (application) {
  <!-- 申込結果（ステータス・申込日時）の表示 -->
  <h1>申込が完了しました</h1>
  <dl>
    <dt>ステータス</dt>
    <dd>{{ application.status }}</dd>

    <dt>申込日時</dt>
    <dd>{{ application.appliedAt | date: 'yyyy/MM/dd HH:mm' }}</dd>
  </dl>

  @if (application.status === 'キャンセル待ち') {
    <p class="note">満席のためキャンセル待ちとして登録されました。受付済の方がキャンセルすると、申込順に自動で繰り上がります。</p>
  }
} @else {
  <!-- ページの再読み込み等で申込結果が無い状態でここに来た場合 -->
  <p>申込結果を表示できません。イベント一覧からやり直してください。</p>
}

<!-- イベント一覧画面へ戻るリンク -->
<a class="btn-link" routerLink="/events">イベント一覧へ</a>
