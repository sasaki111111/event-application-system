spring:
  application:
    name: backend
  datasource:
    url: jdbc:mysql://localhost:3306/eventapp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo
    username: ${DB_USERNAME:eventapp_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
